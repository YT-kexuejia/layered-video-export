<!doctype html><html lang="en"><meta charset="utf-8"><title>Layered Video Export · Minimal adapter example</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Arial,sans-serif}.stage{position:relative;width:1920px;height:1080px;background:#08090b;color:#f0f5fa}.light{position:absolute;left:340px;top:-200px;width:1330px;height:1330px;opacity:.58;mask-image:linear-gradient(90deg,transparent,#000 20%,#000 82%,transparent)}.light canvas{width:100%;height:100%}.content-layer{position:absolute;inset:0}.headline{position:absolute;top:270px;left:102px;width:1100px}.headline p{font-size:20px;letter-spacing:4px;color:#b7dbff}.headline h1{font-size:90px;line-height:1.15;margin:24px 0;width:1000px}.headline .note{font-size:28px;letter-spacing:0}.presenter{position:absolute;left:102px;top:164px;width:1716px}.portrait{height:766px;border-radius:24px;overflow:hidden;background:transparent}.portrait video{width:100%;height:100%;object-fit:cover;object-position:52% 50%}.intro-label{position:absolute;left:140px;bottom:170px;font-size:56px}.brand{position:absolute;top:70px;left:102px;font-size:24px}.edge{position:absolute;bottom:36px;left:102px;font-size:12px;letter-spacing:4px}.scene-visual{position:absolute;left:900px;top:250px;width:400px;height:400px}.portraitshade,.wave,.caption{display:none}
</style><main class="stage"><div class="light"><canvas width="1330" height="1330"></canvas></div><div class="brand">LAYERED VIDEO EXPORT</div><div class="content-layer"><section class="headline"><p>HYBRID RENDERING</p><h1></h1><p class="note"></p></section><div class="scene-visual"></div></div><div class="presenter"><div class="portrait"><video id="speaker" src="source.mp4" preload="metadata"></video><div class="portraitshade"></div></div></div><div class="intro-label">Minimal synthetic example</div><div class="edge">1920 × 1080 / 24 FPS</div></main>
<script type="module">
const story=await(await fetch('story.json')).json();window.__story=story;
const canvas=document.querySelector('.light canvas'),ctx=canvas.getContext('2d');
let current=0;
function seek(t){current=t;const s=story.scenes.find(s=>t>=s.start&&t<s.end)||story.scenes.at(-1);document.querySelector('h1').textContent=s.items[0][0];document.querySelector('.note').textContent=s.items[0][1];const p=Math.max(0,Math.min(1,(t-6.42)/1.2));const q=p<.5?8*p**4:1-(-2*p+2)**4/2;const holder=document.querySelector('.presenter'),portrait=document.querySelector('.portrait');holder.style.left=(102+1394*q)+'px';holder.style.top=(164+128*q)+'px';holder.style.width=(1716-1374*q)+'px';portrait.style.height=(766-266*q)+'px';document.querySelector('.intro-label').style.opacity=Math.max(0,1-(t-6.2)/.3);document.querySelector('.headline').style.opacity=Math.min(1,Math.max(0,(t-7.2)/.8));ctx.clearRect(0,0,1330,1330);const grad=ctx.createLinearGradient(0,1330,1330,0);grad.addColorStop(0,'#071323');grad.addColorStop(.5,'#2e5b86');grad.addColorStop(1,'#102337');ctx.fillStyle=grad;ctx.fillRect(0,0,1330,1330);ctx.save();ctx.strokeStyle='#9dc5e1';ctx.lineWidth=45;ctx.globalAlpha=.20;ctx.beginPath();for(let y=0;y<1330;y+=8){const x=500+Math.sin(y/250+t*.35)*140;ctx.lineTo(x,y);}ctx.stroke();ctx.restore();}
window.__film={seek,getScene(){return story.scenes.find(s=>current>=s.start&&current<s.end)||story.scenes.at(-1)}};seek(0);
</script></html>
