<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio · 视频包装预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b111b;color:#dce8f7;font:15px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:26px}h1{font-size:24px;margin:0 0 8px}.muted{color:#91a4bc}.film{position:relative;aspect-ratio:16/9;margin:22px 0;background:#06080b;overflow:hidden;border:1px solid #293c54;border-radius:12px}iframe{position:absolute;top:0;left:0;width:1920px;height:1080px;border:0;transform-origin:0 0}button,select,a{font:inherit}button,select{background:#142237;border:1px solid #38536f;border-radius:6px;padding:10px 18px;color:#dce8f7;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:hover{background:#213652}button:focus-visible,input:focus-visible{outline:2px solid #8fc6ff;outline-offset:3px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row input{flex:1;min-width:130px}a{color:#9dccff}.panel{border:1px solid #293c54;border-radius:10px;padding:20px;margin:22px 0}.panel h2{margin:0 0 12px;font-size:18px}progress{width:100%;height:10px;margin-top:16px;accent-color:#76b5ff}#chapters{margin-top:14px}#chapters button{padding:7px 12px}#error{color:#ffaaa5;white-space:pre-wrap}#state{line-height:1.8}@media(max-width:600px){main{padding:12px}.panel{padding:14px}button{padding:9px 13px}}</style>
<main><h1>视频包装工作台</h1><div class="muted">自带 Studio Blue 模板 · 原声与字幕 · 1080p / 24 fps · 分层加速导出</div>
<div class="film" id="film"><iframe id="preview" src="/film.html" title="视频画面" allow="autoplay;fullscreen"></iframe></div>
<div class="row"><button id="play">播放</button><span id="time">00:00</span><input id="seek" aria-label="视频进度" type="range" min="0" max="1" step=".01" value="0"><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="full">全屏</button><a href="/captions.srt" download>下载字幕</a></div>
<div class="row" id="chapters"></div><div class="panel"><h2>导出成片</h2><div class="muted">每 5 分钟合成一个段落 验证成功后删除该段原图 中断后保留尚未完成的素材</div><p id="state" aria-live="polite">等待导出</p><div class="row"><button id="export">开始 / 继续导出</button><button id="pause">暂停</button><a id="download" hidden>下载成片</a></div><progress id="progress" max="100" value="0"></progress><p id="error" role="alert"></p></div></main>
<script>
const frame=document.querySelector('#preview'),film=document.querySelector('#film'),range=document.querySelector('#seek');let video,api,raf,pending=false;
const stamp=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
new ResizeObserver(()=>frame.style.transform=`scale(${film.clientWidth/1920})`).observe(film);
function tick(){if(!video)return;api.seek(video.currentTime,true);range.value=video.currentTime;document.querySelector('#time').textContent=stamp(video.currentTime)+' / '+stamp(api.duration);raf=requestAnimationFrame(tick);}
function ready(){api=frame.contentWindow.__film;if(!api)return setTimeout(ready,100);video=frame.contentDocument.querySelector('#speaker');range.max=api.duration;api.seek(0,true);tick();const story=frame.contentWindow.__story;
for(const c of story.chapters){const b=document.createElement('button');b.textContent=c.short;b.onclick=()=>{video.currentTime=c.start};document.querySelector('#chapters').append(b);}video.onended=()=>document.querySelector('#play').textContent='播放';}
frame.onload=ready;
document.querySelector('#play').onclick=async()=>{if(!video)return;if(video.paused){await video.play();document.querySelector('#play').textContent='暂停'}else{video.pause();document.querySelector('#play').textContent='播放'}};
range.oninput=()=>{if(video)video.currentTime=+range.value};document.querySelector('#speed').onchange=e=>{if(video)video.playbackRate=+e.target.value};document.querySelector('#full').onclick=()=>film.requestFullscreen();
async function command(url){if(pending)return;pending=true;document.querySelector('#export').disabled=true;try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error(await r.text());await poll()}catch(e){document.querySelector('#error').textContent=e.message}finally{pending=false;document.querySelector('#export').disabled=false}}
document.querySelector('#export').onclick=()=>command('/api/export');document.querySelector('#pause').onclick=()=>command('/api/export/cancel');
async function poll(){try{const r=await fetch('/api/export');if(!r.ok)throw Error('服务连接失败');const s=await r.json();document.querySelector('#progress').value=s.percent||0;document.querySelector('#state').textContent=`${s.stage} · ${s.phase||''} · ${(s.percent||0).toFixed(1)}% · 已合成 ${s.completedSegments||0} 段`+(s.renderFps?` · 实测 ${s.renderFps.toFixed(1)} 帧/秒`:'');document.querySelector('#error').textContent=s.error||'';const d=document.querySelector('#download');d.hidden=s.stage!=='complete';if(!d.hidden){d.href='/exports/'+s.job+'.mp4';d.download=s.job+'.mp4'}}catch(e){document.querySelector('#error').textContent=e.message}}
poll();const timer=setInterval(poll,2000);addEventListener('pagehide',()=>{clearInterval(timer);cancelAnimationFrame(raf)});
</script></html>
