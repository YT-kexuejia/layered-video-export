<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Layered Video Export</title><style>body{max-width:900px;margin:70px auto;padding:0 24px;background:#0b1320;color:#e9f2fc;font:16px/1.6 system-ui}h1{font-size:36px;margin-bottom:8px}p{color:#a9bacd}button,a{font:inherit;border:1px solid #476281;background:#172940;color:#e9f2fc;border-radius:8px;padding:10px 20px;cursor:pointer}button:disabled{opacity:.5}progress{display:block;width:100%;margin:28px 0}#status{white-space:pre-wrap;font-variant-numeric:tabular-nums}a{display:inline-block;text-decoration:none}</style><h1>Layered Video Export</h1><p>1080p · 24 fps · GPU layers + sparse UI captures + FFmpeg<br>5-minute segments · validated cleanup · resumable local jobs</p><button id="export">Export video</button> <button id="pause" disabled>Pause & keep assets</button><progress id="progress" max="100" value="0"></progress><div id="status" role="status"></div><a id="download" hidden>Download MP4</a><script>
const button=document.querySelector('#export'),pause=document.querySelector('#pause'),progress=document.querySelector('progress'),message=document.querySelector('#status'),download=document.querySelector('#download');let busy=false;
async function poll(){try{const d=await(await fetch('/api/export')).json();busy=['preparing','rendering','segment-encoding','segment-ready','merging'].includes(d.stage);button.disabled=busy;pause.disabled=!busy;button.textContent=d.resumable?'Continue export':'Export video';progress.value=d.percent||0;message.textContent=(d.stage||'idle')+(d.phase?' / '+d.phase:'')+'\n'+(d.percent||0).toFixed(1)+'%'+(d.renderFps?' · overall '+d.renderFps.toFixed(1)+' fps':'')+(d.error?'\n'+d.error:'');download.hidden=d.stage!=='complete';if(d.stage==='complete')download.href=d.url;}catch(e){message.textContent='Cannot reach the local service.';}setTimeout(poll,1500);}
button.onclick=async()=>{button.disabled=true;const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)message.textContent=(await r.json()).error;};pause.onclick=()=>fetch('/api/export/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});poll();
</script></html>
